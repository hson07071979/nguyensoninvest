name: Vẽ ảnh preview

# Moi lan ban dung toi day index.html len day thi ve lai og.png theo so moi nhat.
# Workflow nay nam o repo public, khong dung gi den repo bot — nen khong the lam
# hong day chuyen tin hieu. Hong thi chi la anh preview cu, trang web van chay.
on:
  push:
    paths:
      - 'index.html'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: og
  cancel-in-progress: true

jobs:
  ve:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Cài Pillow
        run: pip install pillow
      - name: Chan NaN trong khoi du lieu
        run: python fix_nan.py
      - name: Ve og.png
        run: python og_card.py
      - name: Đăng ảnh
        run: |
          git config user.name  "Bot Nguyễn Sơn Invest"
          git config user.email "bot@users.noreply.github.com"
          git add index.html og.png
          if git diff --cached --quiet; then
            echo "Ảnh không đổi, bỏ qua."
          else
            git commit -m "Vẽ lại ảnh preview"
            if ! git push; then
              # Hai lần chạy sát nhau: lần kia đã đẩy trước nên lần này bị từ chối.
              # Nếu main đã có commit mới hơn thì bỏ qua (commit mới đó có index.html
              # sẽ tự kích hoạt lần vẽ sau). Không rebase để khỏi ghi đè dữ liệu mới
              # bằng index.html cũ. Lỗi khác (main không đổi) vẫn báo fail.
              git fetch origin "${GITHUB_REF_NAME}"
              if git merge-base --is-ancestor "origin/${GITHUB_REF_NAME}" HEAD~1; then
                echo "::error::Không đẩy được ảnh dù main không có commit mới."
                exit 1
              fi
              echo "::notice::main đã có commit mới hơn (lần chạy khác đã đăng ảnh hoặc có dữ liệu mới). Bỏ qua lần đăng này."
            fi
          fi
