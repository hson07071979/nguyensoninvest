name: Nhịp quét (đồng hồ ảo)

# ĐỒNG HỒ ẢO (28/09/2026): cron của GitHub nổ muộn / bỏ nhịp (đo 14–25/09: lần quét đầu
# trong cửa sổ ATC là 14:21–14:43, 21/09 không có lần nào). Một Cloudflare Worker (xem
# dong-ho/worker.js) gọi workflow này ĐÚNG GIỜ qua API: mỗi lần chạy = MỘT nhịp quét.
#   09:00–11:30 mỗi 20' · 13:00–13:55 mỗi 15' · 14:00–14:45 mỗi 5' · 15:00–20:45 mỗi 15'
# Vòng lặp cũ (live.yml) vẫn giữ làm DỰ PHÒNG: thấy live.json vừa được nhịp này ghi trong
# 8 phút thì nó tự bỏ qua, nên hai bên không giẫm lên nhau.

on:
  workflow_dispatch:
    inputs:
      nguon:
        description: 'Ai gọi (dong-ho / tay)'
        required: false
        default: 'tay'

concurrency:
  group: nhip-quet
  cancel-in-progress: false      # nhịp sau XẾP HÀNG sau nhịp trước, không huỷ

permissions:
  contents: write

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install requests==2.33.1
      - name: Một nhịp quét
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT:  ${{ secrets.TELEGRAM_CHAT }}
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          NTFY_TOKEN: ${{ secrets.NTFY_TOKEN }}
        run: |
          git config user.name  "Bot Nguyễn Sơn Invest"
          git config user.email "bot@users.noreply.github.com"
          echo "gọi bởi: ${{ github.event.inputs.nguon }} · $(TZ=Asia/Ho_Chi_Minh date '+%H:%M:%S') giờ VN"
          mot_nhip() {
            for lan in 1 2 3; do
              git fetch -q origin main && git reset -q --hard origin/main
              python live_scan.py || { echo "!! live_scan.py lỗi"; return 0; }
              mkdir -p obs
              git add live.json obs/ 2>/dev/null || true
              if git diff --cached --quiet; then echo "không có gì đổi"; return 0; fi
              git commit -q -m "Nhịp đồng hồ $(TZ=Asia/Ho_Chi_Minh date '+%d/%m %H:%M')"
              # có người vừa ghi live.json (vòng dự phòng) -> quét lại trên bản mới nhất, KHÔNG gộp tay
              if git push -q origin HEAD:main; then echo "đã đẩy"; return 0; fi
              echo "đẩy lỗi (lần $lan) — quét lại trên bản mới nhất"; sleep 5
            done
          }
          mot_nhip
          # BÁO ĐÚNG GIỜ CHỐT (13/11/2026, audit vào lệnh thực tế): nhịp 14:20 quét xong thì GIỮ MÁY, chờ tới
          # 14:25:20 rồi quét lại ngay. Tin CHỐT MUA DÒ 14:25 không còn phụ thuộc việc GitHub khởi động máy
          # mới cho nhịp 14:25 (đo 02/10–12/11: bản ghi sau chốt trung vị 14:27:02, 2/31 phiên sau 14:30).
          # Nhịp 14:25 của đồng hồ vẫn chạy sau đó như một lần soát lại.
          hm=$(TZ=Asia/Ho_Chi_Minh date +%H%M)
          if [ "$hm" -ge 1420 ] && [ "$hm" -lt 1425 ]; then
            cho=$(( $(TZ=Asia/Ho_Chi_Minh date -d 'today 14:25:20' +%s) - $(date +%s) ))
            if [ "$cho" -gt 0 ] && [ "$cho" -lt 330 ]; then echo "chờ ${cho}s tới 14:25:20 để chốt"; sleep "$cho"; fi
            mot_nhip
          fi
