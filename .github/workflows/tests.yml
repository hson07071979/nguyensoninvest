name: Kiểm tra (tests)
on:
  pull_request:
  push:
    branches: [main]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install requests
      - name: Biên dịch
        run: python -m compileall -q live_scan.py portfolio.py exit_rules.py signal_spec.py allocator.py
      - name: Test (sổ ghi tiến, cổng live, khoá lãi S1)
        run: python -m unittest discover -s tests -p 'test_*.py' -v
